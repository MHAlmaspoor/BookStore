name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Environment
        run: |
            dotnet --info
            dotnet --list-sdks
            dotnet nuget list source

      - name: Restore
        shell: bash
        run: |
            set -o pipefail
            dotnet restore --verbosity detailed 2>&1 | tee restore.log
            exit ${PIPESTATUS[0]}

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
