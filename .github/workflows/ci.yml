name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Build ProductService Docker image
        run: |
          docker build --file Dockerfile --tag bookstore-productservice:ci .

      - name: Build IdentityService Docker image
        run: |
          docker build --file Dockerfile.identity --tag bookstore-identityservice:ci .

      - name: Build NotificationService Docker image
        run: |
          docker build --file Dockerfile.notification --tag bookstore-notificationservice:ci .
